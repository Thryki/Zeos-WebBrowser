<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zeos</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="downloads-backdrop" class="downloads-backdrop" style="display: none;"></div>
  
  <main id="chrome" aria-label="Controles do navegador">
    <!-- Top Bar: Menu, Abas, Performance do Zeos, Downloads e Controles de Janela -->
    <header id="tabs-bar" aria-label="Abas e controles da janela">
      <div class="header-left">
        <button id="app-menu-btn" class="nav-icon-btn menu-btn" title="Menu do Zeos (≡)" aria-label="Menu principal">
          <svg class="ui-icon" viewBox="0 0 16 16">
            <path fill="currentColor" d="M2 3.75h12v1.5H2zm0 3.75h12v1.5H2zm0 3.75h12v1.5H2z"/>
          </svg>
        </button>

        <div class="header-sep"></div>

        <!-- Abas do navegador -->
        <div id="tabs" class="tabs-list" role="tablist"></div>

        <button id="new-tab" class="nav-icon-btn new-tab-btn" title="Nova aba (Ctrl+T)" aria-label="Nova aba">+</button>
        <button id="tabs-overflow" class="nav-icon-btn tabs-overflow-btn" title="Todas as abas abertas" aria-label="Todas as abas" style="display: none;">
          <svg class="ui-icon" viewBox="0 0 16 16">
            <path fill="currentColor" d="M4.646 6.646a.5.5 0 0 1 .708 0L8 9.293l2.646-2.647a.5.5 0 0 1 .708.708l-3 3a.5.5 0 0 1-.708 0l-3-3a.5.5 0 0 1 0-.708z"/>
          </svg>
        </button>
      </div>

      <!-- Espaço vazio para arrastar janela e hover -->
      <div id="tabs-spacer" class="tabs-spacer" title="Clique duas vezes para maximizar ou clique com o botão direito para personalizar"></div>

      <!-- Lado direito: Métricas do Zeos, Downloads e Controles de Janela -->
      <div class="header-right">
        <!-- Métricas exclusivas do processo do Zeos Browser -->
        <div id="stats-group" class="stats-group" title="Consumo de recursos do Zeos">
          <div id="stat-cpu" class="stat-pill stat-cpu" title="Uso de CPU do Zeos (Clique com botão direito para opções)">
            <span class="stat-icon">▲</span>
            <span id="stat-cpu-val" class="stat-val">0%</span>
          </div>
          <div id="stat-ram" class="stat-pill stat-ram" title="Memória RAM em uso pelo Zeos (Clique com botão direito para opções)">
            <span id="stat-ram-val" class="stat-val">280 MB</span>
          </div>
        </div>

        <!-- Botão de Downloads -->
        <button id="downloads" class="nav-icon-btn download-btn" title="Downloads (Ctrl+J)" aria-label="Downloads" style="display:none">
          <svg class="ui-icon" viewBox="0 0 24 24">
            <path d="M12 16l4.5-4.5-1.42-1.42L13 12.16V4h-2v8.16L8.92 10.08 7.5 11.5 12 16zM4 20h16v-2H4v2z" fill="currentColor"/>
          </svg>
          <svg class="dl-progress-ring" viewBox="0 0 28 28">
            <circle class="dl-ring-track" cx="14" cy="14" r="11" />
            <circle class="dl-ring-fill" cx="14" cy="14" r="11" />
          </svg>
          <span id="downloads-badge" class="download-badge" style="display:none">0</span>
        </button>

        <!-- Controles da Janela -->
        <div class="window-controls">
          <button id="minimize" class="window-control-btn" aria-label="Minimizar" title="Minimizar">
            <svg viewBox="0 0 16 16"><path fill="currentColor" d="M3 8.5h10v-1H3v1z"/></svg>
          </button>
          <button id="maximize" class="window-control-btn" aria-label="Maximizar" title="Maximizar">
            <svg viewBox="0 0 16 16">
              <path fill="currentColor" d="M3 3h4v1.2H4.2v2.8H3V3zm10 0v4h-1.2V4.2H9V3h4zM3 13v-4h1.2v2.8H7V13H3zm10 0H9v-1.2h2.8V9H13v4z"/>
            </svg>
          </button>
          <button id="close-window" class="window-control-btn close-btn" aria-label="Fechar" title="Fechar">
            <svg viewBox="0 0 16 16">
              <path fill="currentColor" d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Barra de Navegação e Endereço (URL) -->
    <form id="omnibox-row" autocomplete="off">
      <button id="back" class="nav-icon-btn" type="button" title="Voltar (Alt+←)" aria-label="Voltar">
        <svg class="ui-icon" viewBox="0 0 16 16">
          <path fill="currentColor" fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
        </svg>
      </button>
      <button id="forward" class="nav-icon-btn" type="button" title="Avançar (Alt+→)" aria-label="Avançar">
        <svg class="ui-icon" viewBox="0 0 16 16">
          <path fill="currentColor" fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/>
        </svg>
      </button>
      <button id="reload" class="nav-icon-btn" type="button" title="Recarregar (Ctrl+R)" aria-label="Recarregar">
        <svg class="ui-icon" viewBox="0 0 16 16">
          <path fill="currentColor" fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.418A6 6 0 1 1 8 2v1z"/>
          <path fill="currentColor" d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
        </svg>
      </button>
      <button id="home" class="nav-icon-btn" type="button" title="Página inicial" aria-label="Página inicial">
        <svg class="ui-icon" viewBox="0 0 16 16">
          <path fill="currentColor" d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L8.707 1.5zM13 13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5 5 5V13.5z"/>
        </svg>
      </button>

      <div class="omnibox-container">
        <svg class="omnibox-search-icon" viewBox="0 0 16 16">
          <path fill="currentColor" d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
        </svg>
        <input id="omnibox" type="text" spellcheck="false" aria-label="Endereço ou pesquisa" placeholder="Digite uma URL ou pesquise..." />
      </div>

      <!-- Área de Extensões do Navegador (lado direito da barra de URL) -->
      <div id="extensions-toolbar" class="extensions-toolbar" style="display: none;"></div>
    </form>

    <!-- Painel de Downloads Flutuante -->
    <div id="downloads-panel" class="downloads-panel" style="display: none;" role="dialog" aria-label="Downloads">
      <div class="dl-panel-header">
        <span class="dl-panel-title">Downloads</span>
        <div class="dl-panel-actions">
          <button id="dl-open-folder" class="dl-header-btn" title="Abrir pasta de downloads" aria-label="Abrir pasta de downloads">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z" fill="currentColor"/></svg>
          </button>
          <button id="dl-close-panel" class="dl-header-btn" title="Fechar" aria-label="Fechar">✕</button>
        </div>
      </div>
      <div id="downloads-list" class="dl-panel-list"></div>
      <div id="downloads-empty" class="dl-panel-empty" style="display: none;">
        <svg viewBox="0 0 24 24" width="32" height="32"><path d="M12 16l4.5-4.5-1.42-1.42L13 12.16V4h-2v8.16L8.92 10.08 7.5 11.5 12 16zM4 20h16v-2H4v2z" fill="currentColor"/></svg>
        <p>Nenhum download recente</p>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
