<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>favoritos</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --fg: #f5f5f5;
      --accent: #22c55e;
      --panel: #181818;
      --border: #2a2a2a;
      font-family: "IBM Plex Mono", Consolas, monospace;
      color: var(--fg);
      background: var(--bg);
    }
    body {
      margin: 0;
      padding: 40px 24px;
      background: var(--bg);
      color: var(--fg);
    }
    main {
      max-width: 760px;
      margin: auto;
      border-top: 1px solid var(--accent);
      padding-top: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .brand-logo {
      width: 38px;
      height: 20px;
      display: block;
      fill: var(--accent);
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: #ffffff;
    }
    p {
      color: color-mix(in srgb, var(--fg) 80%, transparent);
      line-height: 1.6;
      font-size: 13.5px;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 7906 4095" aria-hidden="true">
        <path d="M2329.41 0H3952.94V564.706H2894.12V1764.71H3952.94V2329.41H2894.12V3529.41H3952.94V4094.12H2329.41V3176.47V564.706V0Z" fill="currentColor"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M4305.88 4094.12H5576.47V3741.18H5929.41V352.941H5576.47V0H4305.88V352.941H3952.94V1764.71V2329.41V3741.18H4305.88V4094.12ZM5364.71 564.706V3529.41H4517.65V564.706H5364.71Z" fill="currentColor"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M7200 2117.65V1764.71H6847.06V1411.77H6494.12V564.707H7341.18V1270.59H7905.88V352.942H7552.94V0.000976562H6282.35V352.942L5929.41 352.941V1623.53H6282.35V1976.47H6635.29V2329.41H6988.24V2682.35H7341.18V3529.41H6494.12V2470.59H5929.41V3741.18L6282.35 3741.18V4094.12H7552.94V3741.18H7905.88V2470.59H7552.94V2117.65H7200Z" fill="currentColor"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M0 0V917.647H564.706V564.706H1588.24V705.882H1411.76V1058.82H1235.29V1411.76H1058.82V1764.71H882.353V2117.65H705.882V2470.59H529.412V2823.53H352.941V3176.47H176.471V3529.41H0V4094.12H2329.41V3176.47H1764.71V3529.41H741.177V3388.24H917.647V3035.29H1094.12V2682.35H1270.59V2329.41H1447.06V1976.47H1623.53V1623.53H1800V1270.59H1976.47V917.647H2152.94V564.706H2329.41V0H0Z" fill="currentColor"/>
      </svg>
      <h1>zeos://favoritos</h1>
    </div>
    <p>Os favoritos aparecerão aqui. Esta primeira versão mantém o menu de acesso preparado, sem coleta automática de dados de navegação.</p>
  </main>
  <script>
    if (window.zeosSettings) {
      function applyTheme(s) {
        if (!s || !s.appearance) return;
        const root = document.documentElement.style;
        root.setProperty('--bg', s.appearance.background || '#0b0b0b');
        root.setProperty('--fg', s.appearance.foreground || '#f5f5f5');
        root.setProperty('--accent', s.appearance.accent || '#22c55e');
        root.setProperty('--panel', s.appearance.panel || '#181818');
        root.setProperty('--border', s.appearance.border || '#2a2a2a');
        root.fontFamily = `"${s.appearance.font || 'IBM Plex Mono'}", Consolas, monospace`;
      }
      window.zeosSettings.get().then(applyTheme);
      window.zeosSettings.onChanged(applyTheme);
    }
  </script>
</body>
</html>
